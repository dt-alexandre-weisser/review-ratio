name: Release

# Builds the extension zip and publishes it as a GitHub Release, so nobody builds it to install it:
#   https://github.com/dt-alexandre-weisser/review-ratio/releases/latest/download/review-ratio.zip
# always serves the newest build. A v* tag (v0.1.0, matching package.json) also submits the build
# to the Chrome Web Store once its secrets exist: docs/chrome-web-store.md. It also has
# addons.mozilla.org sign the Firefox build, published on the fixed release `firefox` that Firefox
# installs and updates from, once its secrets exist: docs/firefox-add-ons.md.
#
# The version is <packages/extension/package.json version>.<run number>, stamped in the zips only.
# Every trigger of this one workflow shares the run number, so main builds and tag builds keep
# increasing, as the Store requires.
on:
  push:
    branches: [main]
    # What changes the zip. Path filters do not apply to tag pushes: a tag always releases.
    paths:
      - packages/extension/**
      - '!packages/extension/test/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/release.yml
      - .github/scripts/chrome-web-store.sh
      - .github/scripts/firefox-add-ons.sh
    tags: ['v*']
  # From main, a release like a push. From another branch, a prerelease that never becomes Latest.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
      version-name: ${{ steps.package.outputs.version-name }}
      store-configured: ${{ steps.store.outputs.configured }}
      amo-configured: ${{ steps.amo.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck, unit tests, build
        run: pnpm check
      - name: Lint the Firefox build as addons.mozilla.org does
        run: pnpm lint:firefox
      - name: Package the zips
        id: package
        run: |
          args=(--build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --out-dir release)
          # A tag must match package.json: v0.1.0 releases 0.1.0.<run number>.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          node packages/extension/scripts/package.mjs "${args[@]}" > "$RUNNER_TEMP/version.json"
          {
            echo "version=$(jq -r .version "$RUNNER_TEMP/version.json")"
            echo "version-name=$(jq -r .versionName "$RUNNER_TEMP/version.json")"
          } >> "$GITHUB_OUTPUT"
          unzip -l release/review-ratio.zip
      - name: Chrome Web Store secrets
        id: store
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=()
          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice title=Chrome Web Store skipped::Missing secrets ${missing[*]}. See docs/chrome-web-store.md."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: addons.mozilla.org secrets
        id: amo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          missing=()
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice title=Firefox Add-ons skipped::Missing secrets ${missing[*]}. See docs/firefox-add-ons.md."
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-ratio-${{ steps.package.outputs.version }}
          path: release/*.zip
          retention-days: 30
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-ratio-${{ needs.build.outputs.version }}
          path: release
      - name: Publish the release
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            title="review-ratio ${VERSION} (${tag})"
          else
            tag="build-${VERSION}"
            title="review-ratio ${VERSION}"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Version ${VERSION} (${VERSION_NAME}), built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}.

          To install or update:
          1. Download **review-ratio.zip** below and unzip it (to update, replace the old folder).
          2. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and pick the folder (to update, click the reload icon instead).
          3. On the options page that opens, click **Sign in with GitHub**.

          \`review-ratio-chrome-web-store.zip\` is for the Chrome Web Store only: it does not keep the extension's fixed id when loaded unpacked.

          On Firefox, install the build Mozilla signed instead: open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/firefox/review-ratio.xpi in Firefox, click **Add**, then **Sign in with GitHub** on the options page. It updates by itself. \`review-ratio-firefox.zip\` is the unsigned package sent to Mozilla: Firefox does not install it.
          EOF

          # The newest version is Latest, whatever order the runs finish in; a branch run never is.
          flags=()
          if [[ $GITHUB_REF != refs/heads/main && $GITHUB_REF != refs/tags/v* ]]; then
            flags+=(--prerelease --latest=false)
          else
            current=$(gh release view --json name --jq '.name' 2>/dev/null | awk '{print $2}' || true)
            if [[ -z $current || $(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1) == "$VERSION" ]]; then
              flags+=(--latest)
            else
              flags+=(--latest=false)
            fi
          fi

          # A re-run of the same run keeps its version: update that release in place.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/*.zip --clobber
            gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            gh release create "$tag" release/*.zip --verify-tag --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$tag" release/*.zip --target "$GITHUB_SHA" --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          echo "::notice title=GitHub Release::${title}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
      - name: Prune old builds
        if: github.ref == 'refs/heads/main'
        # Keep the 10 newest build-* releases: the Latest link needs one, the others are recent
        # builds to roll back to by hand. v* releases are kept for good.
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do
              echo "Deleting release and tag ${old}"
              gh release delete "$old" --cleanup-tag --yes
            done

  chrome-web-store:
    name: Chrome Web Store
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.store-configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-ratio-${{ needs.build.outputs.version }}
          path: release
      - name: Upload and submit for review
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/chrome-web-store.sh release/review-ratio-chrome-web-store.zip "$VERSION"

  firefox:
    name: Firefox Add-ons
    # The signed file goes on the tag's release, which github-release creates.
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.amo-configured == 'true'
    runs-on: ubuntu-24.04
    # Signing waits for Mozilla's automatic review, usually a few minutes.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-ratio-${{ needs.build.outputs.version }}
          path: release
      - name: Sign and publish
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/firefox-add-ons.sh release/review-ratio-firefox.zip "$VERSION" "$GITHUB_REF_NAME"
