# Cloudflare Workers deployment of the same Hono app (later phase).
#   pnpm --filter @review-ratio/server exec wrangler deploy
name = "review-ratio"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Off on purpose: platform logs record request metadata such as client addresses, which the
# privacy model keeps out of storage. Turn on only with a retention policy that matches it.
[observability]
enabled = false
